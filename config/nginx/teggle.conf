# teggle.timanthonyalexander.de: the built game, served from dist/ (`npm run build`, Node 22 in
# /opt/node22 on lairner). Symlinked to /etc/nginx/sites-enabled/teggle.conf. Cloudflare sits in
# front. The game routes by URL hash (#/play/...), so no path ever needs the index.html fallback.
server {
	server_name teggle.timanthonyalexander.de;
	client_max_body_size 1M;

	root /var/www/teggle/dist;
	# `global` points 404/500/503 at lairner.app; this is a different product,
	# so keep the status codes local and bare. Errors are never cached: without this,
	# Cloudflare keeps a 404 for a file requested just before a deploy added it.
	error_page 404 = @teggle_404;
	error_page 500 = @teggle_500;
	error_page 503 = @teggle_503;
	location @teggle_404 { add_header Cache-Control "no-store" always; return 404; }
	location @teggle_500 { add_header Cache-Control "no-store" always; return 500; }
	location @teggle_503 { add_header Cache-Control "no-store" always; return 503; }

	include global;

	access_log /var/log/nginx/teggle_access.log;
	error_log  /var/log/nginx/teggle_error.log warn;

	# Vite emits content-hashed filenames into /assets/, so they can be pinned forever.
	# ^~ keeps the regex locations from `include global` (\.php$, \.oimg$) out of these.
	location ^~ /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Self-hosted fonts keep fixed names but change almost never.
	location ^~ /fonts/ {
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	# Level files and their traced lines keep their names when the campaign is rebuilt,
	# so every load revalidates (a 304 when nothing changed).
	location ^~ /levels/ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# Pictures keep their names when one is replaced, so a day at most, at the edge too.
	location ^~ /backgrounds/ {
		add_header Cache-Control "public, max-age=86400";
		try_files $uri =404;
	}
	location ^~ /art/ {
		add_header Cache-Control "public, max-age=86400";
		try_files $uri =404;
	}
	location ^~ /icons/ {
		add_header Cache-Control "public, max-age=86400";
		try_files $uri =404;
	}

	# The service worker must never be served stale, or a client can pin itself to an old
	# precache list and stop taking updates.
	location = /sw.js {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		try_files $uri =404;
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "public, max-age=3600";
		try_files $uri =404;
	}

	location = /favicon.svg { try_files $uri =404; access_log off; log_not_found off; }

	# A private game: keep it out of search engines.
	location = /robots.txt {
		default_type text/plain;
		return 200 "User-agent: *\nDisallow: /\n";
	}

	# The shell. index.html carries the asset hashes, so it revalidates on every load.
	# Anything that is not a real file is a 404: never the shell at an asset's URL, which
	# Cloudflare would cache against that URL.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/index.html =404;
	}

	# Issued and renewed by certbot (certonly); do not hand-edit the two lines below.
	ssl_certificate /etc/letsencrypt/live/teggle.timanthonyalexander.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/teggle.timanthonyalexander.de/privkey.pem;
}

# Without this, plain-HTTP requests that reach the origin directly (bypassing the CDN edge)
# fall through to whichever :80 block sorts first. The redirect sits in a location, not at
# server level, so the challenge location certbot's nginx plugin adds on renewal still wins.
server {
	listen 80;
	listen [::]:80;
	server_name teggle.timanthonyalexander.de;
	location / {
		return 301 https://teggle.timanthonyalexander.de$request_uri;
	}
}
