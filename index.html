<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Teggle</title>
    <meta
      name="description"
      content="Teggle is a pachinko shooter: aim the cannon, bounce the ball through about a hundred pegs and clear every orange one within ten balls."
    />
    <meta name="theme-color" content="#1c3989" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/overload.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c3989;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #boot-error {
        position: fixed;
        inset: auto 16px 16px 16px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #25137f;
        color: #f3e525;
        font:
          500 15px/1.4 'Trebuchet MS',
          system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Teggle"></canvas>
    <p id="boot-error" role="alert" hidden></p>
    <noscript>
      <p style="color: #f3e525; font: 16px system-ui; padding: 16px">Teggle needs JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
